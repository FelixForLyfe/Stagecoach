modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT with an attribution condition"
issueTrackerURL = "https://github.com/FelixForLyfe/Stagecoach/issues"

[[mods]]
modId = "stagecoach"
version = "${version}"
displayName = "Stagecoach"
authors = "Feelix"
logoFile = "assets/stagecoach/icon.png"
displayURL = "https://github.com/FelixForLyfe/Stagecoach"
description = '''
Stagecoaches in eleven woods, and a travel network between them: place and name a stop, find coach stops in villages, discover others, and pay XP or items to ride the road. Crash-safe, server-authoritative, and built to be customised by pack makers.
'''

[[mixins]]
config = "stagecoach.mixins.json"

[[mixins]]
config = "stagecoach-neoforge.mixins.json"

[[dependencies.stagecoach]]
modId = "neoforge"
type = "required"
versionRange = "[21.11,)"
ordering = "NONE"
side = "BOTH"

