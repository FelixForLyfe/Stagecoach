xaero_forge_version=dB6E0CY9

# ---- Mod ------------------------------------------------------------------------------------------
# One version for every jar in every Minecraft folder. Base-10 odometer: 1.0.9 -> 1.1.0, never 1.0.10.
mod_version=1.2.0
