org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ---- Platform -------------------------------------------------------------------------------------
# Compiled against what large 1.20.1 packs run, so the jar never needs anything newer.
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
# fabric.mod.json asks for less (0.15+); the dev runs use this one.
loader_version=0.19.1
fabric_api_version=0.92.9+1.20.1
# GeckoLib renders the Blockbench model; 4.8.4 is the oldest version the mod supports, so it compiles against that.
geckolib_version=4.8.4
# Architectury Loom, a drop-in superset of fabric-loom that also builds Forge; no Architectury API is used.
loom_version=1.7-SNAPSHOT

# ---- Optional integrations (compile only) -------------------------------------------------------
jade_fabric_version=11.13.1+fabric
jei_fabric_version=15.20.0.112
ftbchunks_fabric_version=2001.3.8
modmenu_version=7.2.2
permissions_api_version=0.3.1
# Modrinth version ids (maven.modrinth:<project>:<id>): KubeJS 2001.6.5-build.26 with Rhino 2001.2.3-build.10 and
# Architectury 9.2.14; on Forge also Open Parties and Claims 0.32.7 and Xaero's Minimap 26.6.0. The rest go through
# gradle/compat.gradle: JourneyMap 6.0.7, and the Fabric Open Parties and Claims and Xaero's Minimap.
opac_fabric_url=https://cdn.modrinth.com/data/gF3BGWvG/versions/6YqJ6xMD/open-parties-and-claims-fabric-1.20.1-0.32.7.jar
opac_fabric_sha1=5a564ccfc6db13ba3350ea09ea4559accc048a52
kubejs_fabric_version=Pu0Ygbq6
rhino_fabric_version=MLIu0Tct
architectury_fabric_version=WbL7MStR
journeymap_fabric_url=https://cdn.modrinth.com/data/lfHFW1mp/versions/Dk3AKHGe/journeymap-fabric-1.20.1-6.0.7.jar
journeymap_fabric_sha1=3a7090b1d05aa585933707701427de00157066c6
xaero_fabric_url=https://cdn.modrinth.com/data/1bokaNcj/versions/PTqhBV8t/xaerominimap-fabric-1.20.1-26.6.0.jar
xaero_fabric_sha1=6f51d266bac01f03d8d3a36d3a68c68cb6313ce8

# ---- Forge (forge/) --------------------------------------------------------------------------------
