plugins {
    id 'dev.architectury.loom'
    id 'java'
}

version = rootProject.mod_version
group = rootProject.maven_group
base { archivesName = "Stagecoach-forge-${rootProject.minecraft_version}" }

repositories {
    mavenCentral()
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { name = 'JEI'; url = 'https://maven.blamejared.com/' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

apply from: "${rootDir}/gradle/compat.gradle"

def common = "${rootDir}/common/src"

// Jade and FTB Chunks have no Forge build for 1.21.1: their bridges stay out of this jar, and the claim check is the
// stub in forge/src (no claim mod to ask).
def notOnForge = { element ->
    def path = element.file.path.replace('\\', '/')
    path.contains('/common/src/main/java/net/feelix/stagecoach/compat/')
            && (path.contains('/compat/jade/') || element.name == 'FtbChunksBridge.java' || element.name == 'ClaimCompat.java')
}

sourceSets {
    main {
        java.srcDir "${common}/main/java"
        java.exclude notOnForge
        resources.srcDir "${common}/main/resources"
        // Forge 52 loads a separate GameTest source set as a second copy of the mod and drops it, so the tests join
        // main only for a test run (./gradlew :forge:runGametest -Pgametests). Release jars are built without it.
        if (project.hasProperty('gametests')) {
            java.srcDir "${common}/gametest/java"
            java.srcDir "src/gametest/java"
            resources.srcDir "${common}/gametest/resources"
        }
    }
}

loom {
    forge {
        mixinConfig "stagecoach.mixins.json"
    }
    runs {
        gametest {
            server()
            name "Forge Game Test"
            runDir "run/gametest"
            property "forge.enableGameTest", "true"
            property "forge.gameTestServer", "true"
            property "forge.enabledGameTestNamespaces", "stagecoach"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modImplementation("software.bernie.geckolib:geckolib-forge-1.21.1:${rootProject.geckolib_version}") {
        exclude group: "net.sf.jopt-simple" // Forge already has it; a second copy breaks the module layer
    }
    modCompileOnly("mezz.jei:jei-1.21.1-forge:${rootProject.jei_version}") { transitive = false }
    modCompileOnly("maven.modrinth:open-parties-and-claims:${rootProject.opac_forge_version}") { transitive = false }
    modCompileOnly("maven.modrinth:xaeros-minimap:${rootProject.xaero_forge_version}") { transitive = false }
    modCompileOnly compatJar(rootProject.journeymap_forge_url, rootProject.journeymap_forge_sha1, 'META-INF/jarjar/journeymap-api-')
    // GeckoLib carries MixinExtras inside its jar; Forge unpacks it in a real install, Loom doesn't in dev.
    forgeRuntimeLibrary "io.github.llamalad7:mixinextras-forge:0.5.3"
}

// The shared GameTests use vanilla's test positions; Forge 52 shifts them by default (fixGameTestBlockPosAsserts).
tasks.matching { it.name == 'runGametest' }.configureEach {
    doFirst {
        def config = file('run/gametest/config/forge-common.toml')
        config.parentFile.mkdirs()
        config.text = '[general]\nfixGameTestBlockPosAsserts = false\n'
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

jar {
    from("${rootDir}/../LICENSE") { rename { "${it}_Stagecoach" } }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
