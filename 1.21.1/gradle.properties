org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ---- Platform -------------------------------------------------------------------------------------
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
# Architectury's patch that lets Yarn names cover NeoForge's own additions.
yarn_neoforge_patch=1.21+build.4
# Architectury Loom 1.17: GeckoLib 4.9.3 and FTB Chunks 2101.1.22 were built with Loom 1.17, and Loom refuses mods built
# by a newer Loom. Runs on the cached Gradle 9.5.1.
loom_version=1.17-SNAPSHOT

# ---- Fabric (fabric/) -----------------------------------------------------------------------------
# GeckoLib 4.9.3 for 1.21.1 requires Fabric Loader 0.17+ (fabric.mod.json only needs 0.16 for our own code).
loader_version=0.17.3
fabric_api_version=0.116.17+1.21.1

# ---- NeoForge (neoforge/) -------------------------------------------------------------------------
neoforge_version=21.1.251

# ---- Both -----------------------------------------------------------------------------------------
geckolib_version=4.9.3
jade_fabric_version=15.10.6+fabric
jade_neoforge_version=15.10.6+neoforge
# Compile-only; 19.57 was built with Loom 1.18 (newer than Architectury Loom 1.17). The API is unchanged; players run any JEI.
