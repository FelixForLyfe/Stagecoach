# ---- commands ----
cmd-help:
  - '&6Stagecoach &7- craftable stagecoaches and a road network between them.'
  - '&7Place a stagecoach, name it, and right-click it to see where you can go.'
  - '&7Right-click someone else''s stagecoach to discover it. A journey costs a fare: XP levels, or items on some servers.'
  - '&e/stagecoach cancel &7- abandon your journey (your fare comes back)'
cmd-help-admin:
  - '&e/stagecoach give <player> <wood> [amount] &7- give stagecoaches'
  - '&e/stagecoach list [page] &7- every stagecoach on the server'
  - '&e/stagecoach remove <id> &7- take a stagecoach down from anywhere'
  - '&e/stagecoach reload &7- reload config.yml and messages.yml'
